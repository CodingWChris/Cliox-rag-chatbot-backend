services:
  backend:
    build:
      context: .
      args:
        ENV: ${ENV:-development}  # default development, can be switched to production by setting ENV=production
    ports:
      - '8001:8001'
    environment:
      - OLLAMA_URL=http://ollama:11434
      - ENVIRONMENT=${ENV:-development}
      - CORS_ORIGINS=["https://clio-x-mvg-portal-i0991n6xx-ciferresearchs-projects.vercel.app","http://localhost:3000","http://localhost:8000"]
      - PORT=8001
      # Optional: Add API key for production
      - API_KEY=${API_KEY:-}
    restart: unless-stopped
    depends_on:
      - ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/health"]
      interval: 1h
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - ./src:/app/src

  ollama:
    image: ollama/ollama:latest
    command: ["serve"]

    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    restart: unless-stopped

volumes:
  ollama_data:

